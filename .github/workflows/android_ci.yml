name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the App's code
      - name: Checkout App Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # 2. Setup Java (With Gradle Caching to fix the "stuck" issue)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Flutter (With caching enabled)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Inject the PAT into global Git config
      - name: Configure Git Auth for Private Packages
        run: git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      # 5. Fetch Dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Build Debug APK (Verbose flag added to show live progress)
      - name: Build Debug APK
        run: flutter build apk --debug -v

      # 7. Build Release APK (Verifies Proguard/R8 and optimizations)
      - name: Build Release APK
        run: flutter build apk --release --no-codesign